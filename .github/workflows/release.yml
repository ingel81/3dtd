name: Desktop release

# Builds the Windows installer and the Linux AppImage for a version tag, puts
# them on one GitHub release with latest.yml, latest-linux.yml and the
# blockmap for the updater (and the AppImage's .zsync for AppImageUpdate),
# and publishes it once both are up. Publishing is
# what reaches the updater of installed copies and what starts deploy.yml for
# the web version and the landing page.
# See docs/ELECTRON_DESKTOP_PLAN.md (E38 to E41).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.4.0; it must match the version in package.json'
        required: true

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # create the draft release and upload to it

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Angular 22 needs >= 22.22.3 or >= 24.15; Node 24 also brings npm 11.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Tag matches the version
        shell: bash
        run: node desktop/scripts/check-version.js "$TAG"

      # The section becomes the release text and the notes of the update hint;
      # a release without one would announce nothing.
      - name: CHANGELOG.md has this version
        shell: bash
        run: node desktop/scripts/changelog.js check "$TAG"

      - name: Install dependencies (game)
        run: npm ci

      # The installer ships without keys, like the web build: each player
      # enters their own Cesium Ion token (or Google Maps key) in the game.
      - name: Create environment files
        shell: bash
        run: |
          echo "export const environment = {
            production: false,
            tileProvider: 'cesium' as 'cesium' | 'google',
            googleMapsApiKey: '',
            cesiumIonToken: '',
            cesiumAssetId: '2275207',
          };" > src/environments/environment.ts
          echo "export const environment = {
            production: true,
            tileProvider: 'cesium' as 'cesium' | 'google',
            googleMapsApiKey: '',
            cesiumIonToken: '',
            cesiumAssetId: '2275207',
          };" > src/environments/environment.prod.ts

      - name: Test the game
        run: npx vitest run

      # vitest strips types without checking them
      - name: Type-check the specs
        run: npx tsc -p tsconfig.spec.json --noEmit

      # The app serves the build at app://app/, so no /play/ here.
      - name: Build the game
        run: npm run build -- --base-href=/

      - name: Install dependencies (desktop)
        working-directory: desktop
        run: npm ci

      - name: Copy the build into the app
        working-directory: desktop
        run: node scripts/copy-web.js

      # The coop relay for LAN games, run by the app itself (docs/COOP_PLAN.md, C4d)
      - name: Bundle the coop relay
        working-directory: desktop
        run: node scripts/build-relay.js

      - name: Test the desktop shell
        working-directory: desktop
        run: npm test

      - name: Build the installer and draft the release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.config.js --publish always

  # The AppImage goes onto the draft the Windows job made, so it waits for it;
  # two jobs drafting the same release at once would race. The game's tests and
  # the version and changelog checks ran there, this job only builds.
  appimage:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install dependencies (game)
        run: npm ci

      # The AppImage ships without keys, like the installer and the web build.
      - name: Create environment files
        run: |
          echo "export const environment = {
            production: false,
            tileProvider: 'cesium' as 'cesium' | 'google',
            googleMapsApiKey: '',
            cesiumIonToken: '',
            cesiumAssetId: '2275207',
          };" > src/environments/environment.ts
          echo "export const environment = {
            production: true,
            tileProvider: 'cesium' as 'cesium' | 'google',
            googleMapsApiKey: '',
            cesiumIonToken: '',
            cesiumAssetId: '2275207',
          };" > src/environments/environment.prod.ts

      - name: Build the game
        run: npm run build -- --base-href=/

      - name: Install dependencies (desktop)
        working-directory: desktop
        run: npm ci

      - name: Copy the build into the app
        working-directory: desktop
        run: node scripts/copy-web.js

      # The coop relay for LAN games, run by the app itself (docs/COOP_PLAN.md, C4d)
      - name: Bundle the coop relay
        working-directory: desktop
        run: node scripts/build-relay.js

      # electron-builder's AppImage toolset with the update information in the
      # runtime, for AppImageUpdate and the AppImage catalog (TODO E83); the
      # build below takes it through APPIMAGE_TOOLS_PATH.
      - name: AppImage tools with the update information
        working-directory: desktop
        run: node scripts/appimage-tools.js "$RUNNER_TEMP/appimage-tools"

      - name: Build the AppImage and upload it to the draft
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_TOOLS_PATH: ${{ runner.temp }}/appimage-tools
        run: npx electron-builder --linux --config electron-builder.config.js --publish always

      # The .zsync the update information points at, made from the file just
      # uploaded; only the versioned name gets one, so the pattern finds one file.
      - name: Upload the .zsync next to the AppImage
        working-directory: desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q zsync
          appimage=$(ls 3DTD-*-x86_64.AppImage)
          zsyncmake -u "$appimage" -o "$appimage.zsync" "$appimage"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$appimage.zsync"

  # Both files are up, so the draft goes live: the updater of installed copies
  # and deploy.yml (web version and landing page) both hang on this moment.
  publish:
    needs: [release, appimage]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      # Copies without the version in the name, so README and landing page can link
      # /releases/latest/download/3DTD-win-x64-setup.exe for good. The updater reads
      # latest.yml and keeps using the versioned files.
      - name: Add copies with fixed names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '3DTD-*-win-x64-setup.exe' --pattern '3DTD-*-x86_64.AppImage' --dir fixed
          cd fixed
          mv 3DTD-*-win-x64-setup.exe 3DTD-win-x64-setup.exe
          mv 3DTD-*-x86_64.AppImage 3DTD-x86_64.AppImage
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber 3DTD-win-x64-setup.exe 3DTD-x86_64.AppImage

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # The AUR package 3dtd-bin (packaging/aur, TODO E83): pkgver, pkgrel and the
  # checksums of this release, .SRCINFO from makepkg in an Arch container.
  # Pushed to the AUR only when the secret AUR_SSH_PRIVATE_KEY is set (the key
  # of the AUR account that owns 3dtd-bin); without it the job shows the files
  # in its summary to push by hand. A pre-release (a tag with "-") is skipped.
  aur:
    needs: publish
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Whether the key is set, without the key: only the push step sees it
      HAS_AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The sha256 GitHub keeps for the asset (REST field `digest`); an asset
      # without one is downloaded and summed here.
      - name: Version and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # archlinux:base-devel as of 2026-10-05, pinned: what it writes goes to the AUR
          ARCH_IMAGE: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
        run: |
          version="${TAG#v}"
          appimage="3DTD-${version}-x86_64.AppImage"
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq ".assets[] | select(.name == \"$appimage\") | .digest // \"\"")
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            sum="${digest#sha256:}"
          else
            echo "[aur] no digest for $appimage, downloading it"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$appimage" --dir "$RUNNER_TEMP/appimage"
            sum=$(sha256sum "$RUNNER_TEMP/appimage/$appimage" | cut -d' ' -f1)
          fi

          # What the AUR holds now, read anonymously, so a rerun for the same
          # version raises pkgrel only when the package changed (update.sh)
          # (an unknown package clones empty; a failed clone counts as none, pkgrel 1)
          if ! git clone --depth 1 https://aur.archlinux.org/3dtd-bin.git "$RUNNER_TEMP/aur-published"; then
            echo "::warning::could not read 3dtd-bin from the AUR, pkgrel starts at 1"
            mkdir -p "$RUNNER_TEMP/aur-published"
          fi

          # makepkg does not run as root; update.sh checks both values before it uses them
          docker run --rm -e VERSION="$version" -e SUM="$sum" \
            -v "$PWD/packaging/aur:/pkg" -v "$RUNNER_TEMP/aur-published:/published:ro" "$ARCH_IMAGE" \
            bash -c 'set -e; useradd -m builder; chown -R builder /pkg; su builder -c "cd /pkg && bash update.sh $VERSION $SUM /published/PKGBUILD"'
          sudo chown -R "$(id -u):$(id -g)" packaging/aur

          # The container may only set pkgver, pkgrel and the checksums and write .SRCINFO
          others=$(git status --porcelain -- packaging/aur | grep -vx ' M packaging/aur/PKGBUILD' | grep -vx '?? packaging/aur/.SRCINFO' || true)
          if [ -n "$others" ]; then
            echo "[aur] the container changed more than PKGBUILD and .SRCINFO:"; echo "$others"; exit 1
          fi
          lines=$(git diff --unified=0 -- packaging/aur/PKGBUILD | grep '^[-+]' | grep -v '^+++ \|^--- ' || true)
          if echo "$lines" | grep -Ev '^[-+](pkgver|pkgrel|sha256sums)=' | grep -q .; then
            echo "[aur] PKGBUILD changed beyond pkgver, pkgrel and sha256sums:"; echo "$lines"; exit 1
          fi
          grep -qx "pkgver=${version}" packaging/aur/PKGBUILD
          grep -q "^sha256sums=('${sum}' " packaging/aur/PKGBUILD
          srcinfo=packaging/aur/.SRCINFO
          grep -qxP "\tpkgver = ${version}" "$srcinfo"
          grep -qxP "\tsha256sums = ${sum}" "$srcinfo"
          grep -qxF "$(printf '\tsource = %s::https://github.com/ingel81/3dtd/releases/download/v%s/%s' "$appimage" "$version" "$appimage")" "$srcinfo"
          if grep -vP '^(\t?(pkgbase|pkgname|pkgdesc|pkgver|pkgrel|url|arch|license|depends|provides|conflicts|options|source|noextract|sha256sums) = .*)?$' "$srcinfo" | grep -q .; then
            echo "[aur] .SRCINFO has a line it should not:"; cat "$srcinfo"; exit 1
          fi

          fence='```'
          {
            echo "### AUR package 3dtd-bin ${version}"
            for file in PKGBUILD .SRCINFO; do
              printf '\n%s\n%s\n' "$file:" "$fence"
              cat "packaging/aur/$file"
              echo "$fence"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push to the AUR
        if: env.HAS_AUR_KEY == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}
          # The AUR's Ed25519 host key as https://aur.archlinux.org/ lists it under
          # "SSH fingerprints" (read 2026-10-05); the scanned key must match it
          AUR_HOST_FINGERPRINT: 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
        run: |
          install -dm700 ~/.ssh
          ssh-keyscan -t ed25519 aur.archlinux.org > "$RUNNER_TEMP/aur-host"
          scanned=$(ssh-keygen -lf "$RUNNER_TEMP/aur-host" | awk '{print $2}')
          if [ "$scanned" != "$AUR_HOST_FINGERPRINT" ]; then
            echo "[aur] host key $scanned is not the published $AUR_HOST_FINGERPRINT"; exit 1
          fi
          cat "$RUNNER_TEMP/aur-host" >> ~/.ssh/known_hosts
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/3dtd-bin.git aur
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO packaging/aur/3dtd.desktop packaging/aur/3dtd.sh aur/
          cd aur
          git config user.name ingel81
          git config user.email "${AUR_EMAIL:-ingel81@users.noreply.github.com}"
          git add PKGBUILD .SRCINFO 3dtd.desktop 3dtd.sh
          if git diff --cached --quiet; then
            echo "[aur] 3dtd-bin is up to date"
            exit 0
          fi
          git commit -m "Update to $(sed -n 's/^pkgver=//p' PKGBUILD)-$(sed -n 's/^pkgrel=//p' PKGBUILD)"
          git push origin HEAD:master

  # The coop relay for the online lobby, as a container image next to the
  # release (docs/COOP_PLAN.md, D66): ghcr.io/ingel81/3dtd-relay:<version> and
  # :latest. The lobby server pulls it; the relay's protocol has to match the
  # apps of this release.
  relay-image:
    needs: release
    uses: ./.github/workflows/relay-image.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read
      packages: write

  # The web version and the landing page carry the same tag. deploy.yml is
  # called, not left to its `release: published` trigger: GitHub starts no
  # workflow from an event its own GITHUB_TOKEN caused.
  deploy:
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit
