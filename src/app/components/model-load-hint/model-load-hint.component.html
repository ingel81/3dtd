@if (visible()) {
  <div class="mh" role="alert">
    <td-icon class="mh-icon" name="warn" [size]="18"></td-icon>
    <div class="mh-text">
      <span class="mh-title">Models missing</span>
      <span class="mh-line">Did not load: {{ names().join(', ') }}. They stay unseen until a reload.</span>
      <span class="mh-actions">
        <button class="mh-action mh-reload" type="button" (click)="reload()">Reload</button>
        <button class="mh-action" type="button" (click)="hide()">Hide</button>
      </span>
    </div>
  </div>
}
