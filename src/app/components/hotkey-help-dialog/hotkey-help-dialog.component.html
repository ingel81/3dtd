<div class="td-dlg">
  <header class="td-dlg-head">
    <h2 class="td-dlg-title" [id]="titleId">{{ t().extras.keys }}</h2>
    <button class="td-close" type="button" [attr.aria-label]="t().common.close" (click)="close()">
      <td-icon name="close" [size]="12"></td-icon>
    </button>
  </header>

  <div class="td-dlg-body is-loose">
    @for (group of groups(); track group.title) {
      <section class="td-group">
        <h3 class="td-section">{{ group.title }}</h3>
        <dl>
          @for (row of group.rows; track row.label) {
            <div class="td-row hk-row">
              <dt [class.range]="row.range">
                @for (key of row.keys; track $index) {
                  <kbd class="td-kbd">{{ key }}</kbd>
                }
              </dt>
              <dd class="td-text">{{ row.label }}</dd>
            </div>
          }
        </dl>
      </section>
    }
  </div>

  <footer class="td-dlg-foot">
    <p class="td-note hk-hint">{{ t().dialogs.keysOff }}</p>
    <button class="td-btn-primary" type="button" (click)="close()">{{ t().common.close }}</button>
  </footer>
</div>
