<div class="dlg">
  <header class="dlg-head">
    <h2 class="dlg-title" [id]="titleId">Keyboard shortcuts</h2>
    <button class="icon-btn" type="button" aria-label="Close" (click)="close()">
      <td-icon name="cross" [size]="16"></td-icon>
    </button>
  </header>

  <div class="dlg-body">
    @for (group of groups; track group.title) {
      <section class="group">
        <h3 class="section-label">{{ group.title }}</h3>
        <dl>
          @for (row of group.rows; track row.label) {
            <div class="row">
              <dt [class.range]="row.range">
                @for (key of row.keys; track $index) {
                  <kbd>{{ key }}</kbd>
                }
              </dt>
              <dd>{{ row.label }}</dd>
            </div>
          }
        </dl>
      </section>
    }
  </div>

  <footer class="dlg-foot">
    <p class="note">Shortcuts are off while you type or a dialog is open.</p>
    <button class="btn-primary" type="button" (click)="close()">Close</button>
  </footer>
</div>
