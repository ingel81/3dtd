@if (report.active()) {
  <section class="crp td-overlay" aria-label="Cell report">
    <div class="crp-head">
      <span class="td-section">Cell report</span>
      <span class="td-num crp-count">{{ report.spots().length }} / {{ maxCells }} cells</span>
    </div>
    <p class="td-note">Click: cell on or off. Shift + drag: box. Esc: done.</p>
    <!-- Esc in the field ends the report too; the game keys leave a focused text field alone -->
    <input class="td-input crp-note" type="text" placeholder="Note: car, embankment, roof ..." aria-label="Note"
           [value]="report.note()" (input)="onNote($event)" (keydown.escape)="report.stop()">
    <div class="td-actions crp-actions">
      <button type="button" class="td-btn-primary td-btn-sm" (click)="report.copy()"
              [disabled]="report.spots().length === 0">Copy JSON</button>
      <button type="button" class="td-btn-secondary td-btn-sm" (click)="report.clear()"
              [disabled]="report.spots().length === 0">Clear</button>
      <button type="button" class="td-btn-secondary td-btn-sm" (click)="report.stop()">Done</button>
    </div>
    @if (report.status(); as status) {
      <p class="td-note" role="status">{{ status }}</p>
    }
  </section>
}
@if (report.box(); as box) {
  <div class="crp-box"
       [style.left.px]="box.left" [style.top.px]="box.top"
       [style.width.px]="box.right - box.left" [style.height.px]="box.bottom - box.top"></div>
}
