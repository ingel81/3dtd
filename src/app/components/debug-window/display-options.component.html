@if (windowService.displayWindow().isOpen) {
  <app-draggable-debug-panel
    windowId="display"
    title="Display"
    icon="sliders"
    [position]="windowService.displayWindow().position"
    [zIndex]="windowService.displayWindow().zIndex"
    (closed)="windowService.close('display')"
    (positionChange)="windowService.updatePosition('display', $event)"
    (focused)="windowService.bringToFront('display')"
  >
    <div class="td-stack display-options">
      <label class="td-check">
        <input class="td-switch" type="checkbox" [checked]="enemies()" (change)="toggleEnemies()" />
        <span>Enemies</span>
      </label>
      <label class="td-check">
        <input class="td-switch" type="checkbox" [checked]="healthBars()" (change)="toggleHealthBars()" />
        <span>Health Bars</span>
      </label>
      <label class="td-check">
        <input class="td-switch" type="checkbox" [checked]="animations()" (change)="toggleAnimations()" />
        <span>Animations</span>
      </label>
      <label class="td-check">
        <input class="td-switch" type="checkbox" [checked]="movement()" (change)="toggleMovement()" />
        <span>Movement</span>
      </label>
      <div class="td-caps td-line-top separator">Effects</div>
      <label class="td-check">
        <input class="td-switch" type="checkbox" [checked]="screenShake()" (change)="toggleScreenShake()" />
        <span>Screen Shake</span>
      </label>
      <div class="td-caps td-line-top separator">Tiles</div>
      <label class="td-check" title="Tiles by geometric error: dark = fine, white = 20 m or coarser">
        <input class="td-switch" type="checkbox" [checked]="tileLodDebug()" (change)="toggleTileLodDebug()" />
        <span>LOD Colors</span>
      </label>
      <div class="td-caps td-line-top separator">Post-Processing</div>
      <label class="td-setting">
        <span>Color Grading</span>
        <select class="td-select select is-auto" (change)="onColorGradingChange($event)">
          @for (preset of colorGradingPresets; track preset.id) {
            <option [value]="preset.id" [selected]="colorGrading() === preset.id">
              {{ preset.label }}
            </option>
          }
        </select>
      </label>
    </div>
  </app-draggable-debug-panel>
}
