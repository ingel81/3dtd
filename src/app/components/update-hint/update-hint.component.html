<!-- Shown through the CDK overlay, see UpdateHintComponent.show() -->
<ng-template #chip>
  @if (update(); as u) {
    <div class="uh td-overlay" role="status">
      <td-icon class="uh-icon" name="refresh" [size]="18"></td-icon>
      <div class="td-stack uh-text">
        <span class="td-section">{{ t().update.ready }}</span>
        <span class="td-note">{{ t().update.installsOnQuit(u.version) }}</span>
        @if (noteItems().shown.length) {
          <ul class="td-note uh-notes">
            @for (item of noteItems().shown; track $index) {
              <li>{{ item }}</li>
            }
            @if (noteItems().more) {
              <li class="td-muted uh-more">{{ t().update.more }}</li>
            }
          </ul>
        }
        <span class="td-note">{{ t().update.endsGame }}</span>
        <span class="td-actions is-start uh-actions">
          <button class="uh-action uh-restart td-btn-primary td-btn-sm" type="button" (click)="restart()">{{ t().update.restartNow }}</button>
          <button class="uh-action td-btn-secondary td-btn-sm" type="button" (click)="hide()">{{ t().update.later }}</button>
        </span>
      </div>
    </div>
  }
</ng-template>
