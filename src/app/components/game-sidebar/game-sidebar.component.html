<aside class="td-sidebar">
  <div class="td-sidebar-content">
    <app-sidebar-wave-panel
      [waveActive]="waveActive()"
      [isGameOver]="isGameOver()"
      (startWave)="startWave.emit()"
    />

    <app-sidebar-build-panel
      [towerTypes]="towerTypes()"
      [buildMode]="buildMode()"
      [isGameOver]="isGameOver()"
      (selectTower)="selectTower.emit($event)"
      (cancelBuild)="cancelBuild.emit()"
    />

    <!-- HERO Section while he is selected, else TOWER Section (only when tower selected) -->
    @if (heroSelected()) {
      <app-sidebar-hero-panel />
    } @else if (store.selectedTower(); as tower) {
      @if (isResearchCenter()) {
        <app-sidebar-research-panel
          [tower]="tower"
          (sellTower)="sellTower.emit()"
          (upgradeTower)="upgradeTower.emit($event)"
          (cancelResearch)="cancelResearch.emit($event)"
        />
      } @else if (isPassiveBuilding()) {
        <app-sidebar-building-panel
          [tower]="tower"
          (sellTower)="sellTower.emit()"
        />
      } @else {
        <app-sidebar-tower-panel
          [tower]="tower"
          (sellTower)="sellTower.emit()"
          (upgradeTower)="upgradeTower.emit($event)"
          (changeTargeting)="changeTargeting.emit($event)"
          (changeAirSubStrategy)="changeAirSubStrategy.emit($event)"
          (setHoldFire)="setHoldFire.emit($event)"
          (takeControl)="takeControl.emit($event)"
        />
      }
    }

    <!-- Footer: the menu, the tips again, the version (opens What's new). The world
         map, the runs and the project page live in the menu. -->
    <div class="td-sidebar-footer">
      <button class="td-foot-btn td-foot-menu" type="button" (click)="openMenu()" aria-keyshortcuts="Escape"
              matTooltip="Menu (Esc)" matTooltipPosition="above">
        <td-icon name="cog" [size]="14"></td-icon>
        <span>Menu</span>
      </button>
      <button class="td-foot-btn" type="button" (click)="showTips()"
              matTooltip="Show the first-run tips again" matTooltipPosition="above">
        <td-icon name="bulb" [size]="14"></td-icon>
        <span>Tips</span>
      </button>
      <button class="td-foot-btn td-version" type="button" (click)="openWhatsNew()"
              [attr.aria-label]="versionLabel"
              matTooltip="What's new in this version" matTooltipPosition="above">
        <span>{{ buildVersion }}</span>
      </button>
    </div>
  </div>
</aside>
