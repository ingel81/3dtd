<aside class="td-sidebar">
  <div class="td-sidebar-content">
    <app-sidebar-wave-panel
      [waveActive]="waveActive()"
      [isGameOver]="isGameOver()"
      (startWave)="startWave.emit()"
    />

    <app-sidebar-build-panel
      [towerTypes]="towerTypes()"
      [buildMode]="buildMode()"
      [isGameOver]="isGameOver()"
      (selectTower)="selectTower.emit($event)"
      (cancelBuild)="cancelBuild.emit()"
    />

    <!-- HERO Section while he is selected, else TOWER Section (only when tower selected) -->
    @if (heroSelected()) {
      <app-sidebar-hero-panel />
    } @else if (store.selectedTower(); as tower) {
      @if (isResearchCenter()) {
        <app-sidebar-research-panel
          [tower]="tower"
          (sellTower)="sellTower.emit()"
          (upgradeTower)="upgradeTower.emit($event)"
          (cancelResearch)="cancelResearch.emit($event)"
        />
      } @else if (isPassiveBuilding()) {
        <app-sidebar-building-panel
          [tower]="tower"
          (sellTower)="sellTower.emit()"
        />
      } @else {
        <app-sidebar-tower-panel
          [tower]="tower"
          (sellTower)="sellTower.emit()"
          (upgradeTower)="upgradeTower.emit($event)"
          (changeTargeting)="changeTargeting.emit($event)"
          (changeAirSubStrategy)="changeAirSubStrategy.emit($event)"
          (setHoldFire)="setHoldFire.emit($event)"
          (takeControl)="takeControl.emit($event)"
        />
      }
    }

    <!-- Footer -->
    <div class="td-sidebar-footer">
      <div class="td-footer-links">
        <button class="td-attributions-btn" (click)="openWorldMap()" aria-label="World map of the places you defended"
                matTooltip="World map of the places you defended" matTooltipPosition="above">
          <td-icon name="globe" [size]="10"></td-icon>
          <span>World</span>
        </button>
        <button class="td-attributions-btn" (click)="showTips()" aria-label="Show the first-run tips again"
                matTooltip="Show the first-run tips again" matTooltipPosition="above">
          <td-icon name="bulb" [size]="10"></td-icon>
          <span>Tips</span>
        </button>
        <button class="td-attributions-btn" (click)="openHotkeys()" aria-label="Keyboard shortcuts"
                aria-keyshortcuts="H"
                matTooltip="Keyboard shortcuts (H or ?)" matTooltipPosition="above">
          <td-icon name="keyboard" [size]="10"></td-icon>
          <span>Keys</span>
        </button>
        <button class="td-attributions-btn" (click)="openTokenSetup()" aria-label="Map access: Cesium Ion token or Google Maps key"
                matTooltip="Map access: Cesium Ion token or Google Maps key" matTooltipPosition="above">
          <td-icon name="lock" [size]="10"></td-icon>
          <span>Map Key</span>
        </button>
        <button class="td-attributions-btn" (click)="openRuns()" aria-label="The runs this browser kept"
                matTooltip="The runs this browser kept, with export" matTooltipPosition="above">
          <td-icon name="filing" [size]="10"></td-icon>
          <span>Runs</span>
        </button>
        <button class="td-attributions-btn" (click)="openAttributions()" aria-label="Credits for models, sounds, music and map data"
                matTooltip="Credits for models, sounds, music and map data" matTooltipPosition="above">
          <td-icon name="copyright" [size]="10"></td-icon>
          <span>Attributions</span>
        </button>
      </div>
      <div class="td-sidebar-footer-bottom">
        <button class="td-version" type="button" (click)="openWhatsNew()" title="What's new in this version">{{ buildVersion }}</button>
        <a href="https://github.com/ingel81/3dtd" target="_blank" class="td-repo-link" title="GitHub" aria-label="3DTD on GitHub">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <span class="td-author">@ingel81</span>
      </div>
    </div>
  </div>
</aside>
