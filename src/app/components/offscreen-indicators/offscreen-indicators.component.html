@for (arrow of arrows(); track $index) {
  <button type="button" class="osi td-marker-btn" [class.osi-boss]="arrow.boss" [style.left.px]="arrow.x" [style.top.px]="arrow.y"
          [attr.aria-label]="arrow.boss ? t().hud.offscreen.boss : t().hud.offscreen.nearest"
          (click)="goTo($index)">
    <span class="td-overlay td-marker" [class.is-sm]="!arrow.boss">
      <td-icon name="caretR" [size]="14"
               [style.transform]="'rotate(' + arrow.angle + 'deg)'"></td-icon>
    </span>
    @if (arrow.count > 1) {
      <span class="osi-count td-overlay td-num"
            [style.transform]="'translate(' + arrow.labelX + 'px, ' + arrow.labelY + 'px)'">{{ arrow.count }}</span>
    }
  </button>
}
