@if (view(); as boss) {
  <div class="boss-bar td-overlay">
    <div class="boss-head">
      <span class="td-name boss-name">{{ boss.name }}</span>
      <span class="td-note td-num">{{ boss.hpText }}</span>
    </div>
    <div class="td-progress boss-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"
         [attr.aria-valuenow]="boss.percent" [attr.aria-label]="boss.name + ' health'">
      <div class="boss-fill" [style.width.%]="boss.percent"></div>
    </div>
    @if (boss.others.length > 0) {
      <div class="boss-others">
        @for (fill of boss.others; track $index) {
          <div class="td-progress boss-track is-small">
            <div class="boss-fill" [style.width.%]="fill"></div>
          </div>
        }
        @if (boss.more > 0) {
          <span class="td-note td-num">+{{ boss.more }}</span>
        }
      </div>
    }
  </div>
}
