@if (visible()) {
  <div class="td-ability-bar" role="group" [attr.aria-label]="t().hud.ability.group">
    @if (hero(); as hero) {
      <button type="button" class="td-icon-btn is-over-map td-bar-btn td-bar-hero"
              [class.is-apart]="buttons().length > 0"
              [attr.aria-pressed]="hero.selected"
              [attr.aria-label]="hero.name"
              [attr.aria-keyshortcuts]="hero.hotkey"
              [tdRichTooltip]="heroTooltip()"
              tdRichTooltipPosition="right"
              (click)="heroPressed.emit()">
        <td-icon [name]="hero.icon" [size]="22"></td-icon>
        @if (hero.hotkey) {
          <span class="td-bar-key td-caps" aria-hidden="true">{{ hero.hotkey.toUpperCase() }}</span>
        }
      </button>
    }

    @for (button of buttons(); track button.id) {
      <button type="button" class="td-icon-btn is-over-map td-bar-btn td-ability-btn"
              [attr.data-state]="button.view.state"
              [attr.aria-disabled]="!button.view.enabled"
              [class.is-busy]="!button.view.enabled"
              [attr.aria-pressed]="button.view.state === 'armed'"
              [attr.aria-label]="button.view.label"
              [attr.aria-keyshortcuts]="button.hotkey"
              [tdRichTooltip]="button.tooltip"
              tdRichTooltipPosition="right"
              (click)="press(button.id)">
        <td-icon [name]="button.icon" [size]="20"></td-icon>
        <span class="td-bar-key td-caps" aria-hidden="true">{{ button.hotkey }}</span>
        <span class="td-rivets td-ability-rivets" aria-hidden="true">
          @for (fill of button.view.rivets; track $index) {
            <i [class.is-on]="fill >= 1" [style.--rivet-fill]="fill"></i>
          }
        </span>
      </button>
    }
  </div>
}
