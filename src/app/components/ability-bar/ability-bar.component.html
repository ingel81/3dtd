<div class="td-ability-bar" role="group" aria-label="Abilities">
  @if (hero(); as hero) {
    <button type="button" class="td-bar-btn td-bar-hero"
            [class.td-bar-hero-selected]="hero.selected"
            [attr.aria-pressed]="hero.selected"
            [attr.aria-label]="hero.name"
            [attr.aria-keyshortcuts]="hero.hotkey"
            [tdRichTooltip]="heroTooltip()"
            tdRichTooltipPosition="right"
            (click)="heroPressed.emit()">
      <td-icon [name]="hero.icon" [size]="22"></td-icon>
      @if (hero.hotkey) {
        <span class="td-bar-key" aria-hidden="true">{{ hero.hotkey.toUpperCase() }}</span>
      }
    </button>
    <span class="td-bar-rule" aria-hidden="true"></span>
  }

  @for (button of buttons(); track button.id) {
    <button type="button" class="td-bar-btn td-ability-btn"
            [attr.data-state]="button.view.state"
            [attr.aria-disabled]="!button.view.enabled"
            [attr.aria-pressed]="button.view.state === 'armed'"
            [attr.aria-label]="button.view.label"
            [attr.aria-keyshortcuts]="button.hotkey"
            [tdRichTooltip]="button.tooltip"
            tdRichTooltipPosition="right"
            (click)="press(button.id, button.view.enabled)">
      <td-icon [name]="button.icon" [size]="20"></td-icon>
      <span class="td-bar-key" aria-hidden="true">{{ button.hotkey }}</span>
      @if (button.view.charges !== null) {
        <span class="td-ability-charges" aria-hidden="true">{{ button.view.charges }}</span>
      }
      @if (button.view.state === 'locked') {
        <td-icon class="td-ability-lock" name="lock" [size]="9"></td-icon>
      } @else {
        <span class="td-ability-pips" aria-hidden="true">
          @for (lit of button.view.pips; track $index) {
            <span class="td-ability-pip" [class.td-ability-pip-lit]="lit"></span>
          }
        </span>
      }
    </button>
  }
</div>
