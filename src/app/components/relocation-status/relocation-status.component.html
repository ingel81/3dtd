@if (status(); as s) {
  <div class="rls td-chip">
    <td-icon class="rls-icon" name="pin" [size]="18"></td-icon>
    <div class="td-stack rls-text">
      <span class="td-section">{{ s.title }}</span>
      <span class="td-note td-num">
        {{ s.step }}
        @if (s.percent !== null) {
          <span class="td-muted" aria-hidden="true">{{ s.percent }}%</span>
        }
      </span>
    </div>
    @if (s.percent !== null) {
      <span class="td-progress is-edge" aria-hidden="true">
        <span [style.width.%]="s.percent"></span>
      </span>
    }
  </div>
}
