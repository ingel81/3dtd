<div class="globe" [style.width.px]="size()" [style.height.px]="size()">
  <canvas #canvas role="img" [attr.aria-label]="ariaLabel()"></canvas>
  @if (hover(); as h) {
    <div class="td-popup globe-tip" [class.below]="h.below" [style.left.px]="h.x" [style.top.px]="h.y">
      <span class="td-name">{{ h.record.name }}</span>
      @if (h.record.detail !== h.record.name) {
        <span class="td-note">{{ h.record.detail }}</span>
      }
      <span class="td-figure">Best wave {{ h.record.bestWave }}@if (h.isCurrent) {<span class="td-muted">, playing now</span>}</span>
    </div>
  }
</div>
