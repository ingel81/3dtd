<nav class="mh-panel td-panel" aria-label="Main menu">
  @if (layer() === 'pause') {
    <p class="mh-pause-line td-note">{{ pauseLine() }}</p>
  }

  <div class="td-menu" role="menu" aria-label="Menu" aria-orientation="vertical" tdRovingGroup>
    @for (entry of entries(); track entry.id) {
      @if (entry.below && !entries()[$index - 1]?.below) {
        <div class="td-menu-rule" role="separator"></div>
      }
      <button type="button" role="menuitem" class="mh-item td-menu-item"
              [attr.aria-current]="menu.page() === entry.id ? 'page' : null"
              [attr.data-entry]="entry.id" [attr.aria-disabled]="entry.loads && menu.playBlocked() ? true : null"
              [attr.aria-busy]="showsBar(entry) || (entry.id === 'continue' && busy()) ? true : null"
              (click)="activate(entry)" (mouseenter)="followPointer($event)">
        <td-icon [name]="icons[entry.id]" [size]="18" />
        <span class="mh-text">
          <span class="mh-label">{{ entry.label }}</span>
          @if (subOf(entry); as sub) {
            <small class="mh-sub">{{ sub }}</small>
          }
          @if (showsBar(entry)) {
            <span class="mh-bar td-progress" aria-hidden="true"><span [style.width.%]="plate().percent"></span></span>
          }
        </span>
      </button>
    }
  </div>

  @if (confirm(); as confirm) {
    <div class="mh-confirm td-banner is-warn td-stack" role="group" aria-labelledby="td-menu-confirm">
      <p id="td-menu-confirm">{{ confirmText(confirm).question }}</p>
      <div class="td-actions is-start">
        <button type="button" class="td-btn-primary" (click)="confirmed()">{{ confirmText(confirm).yes }}</button>
        <button type="button" class="td-btn-secondary" (click)="cancelConfirm()">Cancel</button>
      </div>
    </div>
  }

  @if (status(); as status) {
    <p class="mh-status td-note is-warn" role="status">{{ status }}</p>
  }
</nav>
