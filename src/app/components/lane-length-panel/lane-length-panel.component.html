@if (view(); as v) {
  <div class="ll td-overlay" role="group" [attr.aria-label]="t().hud.laneLengths.group">
    <span class="td-section">{{ t().hud.laneLengths.title }}</span>
    @for (row of v.rows; track $index) {
      <div class="ll-row td-note td-num" [class.edited]="row.edited">
        <span class="td-swatch" [style.--td-mark]="row.color"></span>
        <span class="ll-label">{{ row.label }}</span>
        <span class="ll-bar td-progress"><span class="ll-fill" [style.width.%]="row.share * 100" [style.background]="row.color"></span></span>
        <span class="ll-m">{{ row.meters === null ? '–' : row.meters + ' m' }}</span>
      </div>
    }
    @if (v.deltaPercent !== null) {
      <span class="td-note td-num">{{ t().hud.laneLengths.delta(v.deltaPercent) }}</span>
    }
  </div>
}
