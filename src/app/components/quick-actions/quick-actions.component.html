<div class="qa-root">
  <!-- Route Animation Button -->
  <button class="td-icon-btn"
          (click)="playRouteAnimation.emit()"
          matTooltip="Play route animation"
          matTooltipPosition="above"
          aria-label="Play route animation">
    <td-icon name="route" [size]="18"></td-icon>
  </button>
  <!-- Settings: the menu's Settings page (effects, audio, graphics) -->
  <button class="td-icon-btn"
          (click)="settingsRequested.emit()"
          matTooltip="Settings" matTooltipPosition="above"
          aria-label="Settings">
    <td-icon name="sliders" [size]="18"></td-icon>
  </button>
  <button class="td-icon-btn"
          (click)="photoModeRequested.emit()"
          matTooltip="Photo mode: hide the interface, keep the camera free, save screenshots (O)"
          matTooltipPosition="above"
          aria-label="Photo mode" aria-keyshortcuts="O">
    <td-icon name="camera" [size]="18"></td-icon>
  </button>
  <!-- Layer Menu (collapsible, expands upward) -->
  <div class="qa-wrap">
    <div class="qa-layers" [class.is-open]="uiStore.layerMenuExpanded()">
      <button class="td-icon-btn"
              [class.is-on]="uiStore.spatialGridDebugVisible()"
              (click)="spatialGridDebugToggled.emit()"
              matTooltip="Route Grid Overlay. Fill: grey no tower, green covered. Outline: white cell, blue bridge deck and the way carrying it on past its end, yellow tunnel or covered passage, pink no height sample (a tower's LOS view leaves it out). Brighter: centre line"
              matTooltipPosition="left"
              aria-label="Route Grid Overlay" [attr.aria-pressed]="uiStore.spatialGridDebugVisible()">
        <td-icon name="grid" [size]="18"></td-icon>
      </button>
      <button class="td-icon-btn"
              [class.is-on]="uiStore.buildingsVisible()"
              (click)="uiStore.toggleBuildings(); buildingsToggled.emit()"
              matTooltip="Show buildings"
              matTooltipPosition="left"
              aria-label="Show buildings" [attr.aria-pressed]="uiStore.buildingsVisible()">
        <td-icon name="tower" [size]="18"></td-icon>
      </button>
      <button class="td-icon-btn"
              [class.is-on]="uiStore.streetsVisible()"
              (click)="uiStore.toggleStreets(); streetsToggled.emit()"
              matTooltip="Show streets"
              matTooltipPosition="left"
              aria-label="Show streets" [attr.aria-pressed]="uiStore.streetsVisible()">
        <td-icon name="route" [size]="18"></td-icon>
      </button>
      <button class="td-icon-btn"
              [class.is-on]="uiStore.routesVisible()"
              (click)="uiStore.toggleRoutes(); routesToggled.emit()"
              matTooltip="Show routes"
              matTooltipPosition="left"
              aria-label="Show routes" [attr.aria-pressed]="uiStore.routesVisible()">
        <td-icon name="chart" [size]="18"></td-icon>
      </button>
      <button class="td-icon-btn"
              [class.is-on]="uiStore.airRouteVisible()"
              (click)="airRouteToggled.emit()"
              matTooltip="Air-route altitude"
              matTooltipPosition="left"
              aria-label="Air-route altitude" [attr.aria-pressed]="uiStore.airRouteVisible()">
        <td-icon name="wind" [size]="18"></td-icon>
      </button>
      <button class="td-icon-btn"
              [class.is-on]="uiStore.airSpatialGridDebugVisible()"
              (click)="airSpatialGridDebugToggled.emit()"
              matTooltip="Air Route Grid Overlay. Fill: grey no tower, blue covered. Outline as in the Route Grid Overlay"
              matTooltipPosition="left"
              aria-label="Air Route Grid Overlay" [attr.aria-pressed]="uiStore.airSpatialGridDebugVisible()">
        <td-icon name="gridAir" [size]="18"></td-icon>
      </button>
      <button class="td-icon-btn"
              (click)="perTowerLosFilterCycled.emit()"
              [matTooltip]="perTowerLosFilterTooltip()"
              matTooltipPosition="left"
              [attr.aria-label]="perTowerLosFilterTooltip()">
        <td-icon [name]="perTowerLosFilterIcon()" [size]="18"></td-icon>
      </button>
    </div>
    <button class="td-icon-btn"
            [class.is-on]="uiStore.layerMenuExpanded()"
            (click)="uiStore.toggleMenu('layers')"
            matTooltip="Layers"
            matTooltipPosition="above"
            aria-label="Layers" [attr.aria-expanded]="uiStore.layerMenuExpanded()">
      <td-icon name="layers" [size]="18"></td-icon>
    </button>
  </div>
  <button class="td-icon-btn" (click)="resetCamera.emit()" matTooltip="Reset camera" matTooltipPosition="above"
          aria-label="Reset camera">
    <td-icon name="target" [size]="18"></td-icon>
  </button>
  <!-- Dev Menu: tile grid in four groups, opens above the quick-actions bar -->
  <div class="qa-wrap">
    <div class="td-overlay td-reveal is-up qa-dev" [class.is-open]="uiStore.devMenuExpanded()">
      <div class="td-caps qa-group">Map</div>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="uiStore.heightDebugVisible()"
              (click)="heightDebugToggled.emit()"
              matTooltip="Height markers"
              matTooltipPosition="left"
              aria-label="Height markers" [attr.aria-pressed]="uiStore.heightDebugVisible()">
        <td-icon name="terrain" [size]="18"></td-icon>
        <span class="td-caps">Height</span>
      </button>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="uiStore.specialPointsDebugVisible()"
              (click)="specialPointsDebugToggled.emit()"
              matTooltip="Special points"
              matTooltipPosition="left"
              aria-label="Special points" [attr.aria-pressed]="uiStore.specialPointsDebugVisible()">
        <td-icon name="pin" [size]="18"></td-icon>
        <span class="td-caps">Points</span>
      </button>
      <button class="td-icon-btn qa-tile"
              (click)="refreshHeights.emit()"
              matTooltip="Re-raycast heights"
              matTooltipPosition="left"
              aria-label="Re-raycast heights">
        <td-icon name="refresh" [size]="18"></td-icon>
        <span class="td-caps">Recast</span>
      </button>
      <!-- State dump: JSON download for bug reports -->
      <button class="td-icon-btn qa-tile"
              (click)="debugStateDump.dumpAndDownload()"
              matTooltip="Download state dump (JSON)"
              matTooltipPosition="left"
              aria-label="Download state dump">
        <td-icon name="copy" [size]="18"></td-icon>
        <span class="td-caps">Dump</span>
      </button>

      <div class="td-caps qa-group">View &amp; Panels</div>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="debugWindows.cameraWindow().isOpen"
              (click)="debugWindows.toggle('camera')"
              matTooltip="Camera info"
              matTooltipPosition="left"
              aria-label="Camera info" [attr.aria-pressed]="debugWindows.cameraWindow().isOpen">
        <td-icon name="eye" [size]="18"></td-icon>
        <span class="td-caps">Camera</span>
      </button>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="cameraFramingDebug()"
              (click)="cameraFramingDebugToggled.emit()"
              matTooltip="Framing guides"
              matTooltipPosition="left"
              aria-label="Framing guides" [attr.aria-pressed]="cameraFramingDebug()">
        <td-icon name="fullscreen" [size]="18"></td-icon>
        <span class="td-caps">Frame</span>
      </button>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="debugWindows.displayWindow().isOpen"
              (click)="debugWindows.toggle('display')"
              matTooltip="Display options"
              matTooltipPosition="left"
              aria-label="Display options" [attr.aria-pressed]="debugWindows.displayWindow().isOpen">
        <td-icon name="sliders" [size]="18"></td-icon>
        <span class="td-caps">Display</span>
      </button>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="debugWindows.performanceWindow().isOpen"
              (click)="debugWindows.toggle('performance')"
              matTooltip="Performance"
              matTooltipPosition="left"
              aria-label="Performance" [attr.aria-pressed]="debugWindows.performanceWindow().isOpen">
        <td-icon name="speed" [size]="18"></td-icon>
        <span class="td-caps">Perf</span>
      </button>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="debugWindows.losWindow().isOpen"
              (click)="debugWindows.toggle('los')"
              matTooltip="LOS Cubemap"
              matTooltipPosition="left"
              aria-label="LOS Cubemap" [attr.aria-pressed]="debugWindows.losWindow().isOpen">
        <td-icon name="layers" [size]="18"></td-icon>
        <span class="td-caps">LOS</span>
      </button>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="debugWindows.soundWindow().isOpen"
              (click)="debugWindows.toggle('sound')"
              matTooltip="Spatial audio"
              matTooltipPosition="left"
              aria-label="Spatial audio" [attr.aria-pressed]="debugWindows.soundWindow().isOpen">
        <td-icon name="audio" [size]="18"></td-icon>
        <span class="td-caps">Audio</span>
      </button>
      @if (devWorld.isActive) {
        <button class="td-icon-btn qa-tile"
                [class.is-on]="debugWindows.devworldWindow().isOpen"
                (click)="debugWindows.toggle('devworld')"
                matTooltip="DevWorld"
                matTooltipPosition="left"
                aria-label="DevWorld" [attr.aria-pressed]="debugWindows.devworldWindow().isOpen">
          <td-icon name="target" [size]="18"></td-icon>
          <span class="td-caps">DevWorld</span>
        </button>
      }

      <div class="td-caps qa-group">Cheats</div>
      <button class="td-icon-btn qa-tile qa-cheat is-red"
              (click)="killAllEnemies.emit()"
              matTooltip="Kill all enemies"
              matTooltipPosition="left"
              aria-label="Kill all enemies">
        <td-icon name="skull" [size]="18"></td-icon>
        <span class="td-caps">Kill</span>
      </button>
      <button class="td-icon-btn qa-tile qa-cheat is-brass"
              (click)="addCredits.emit($event)"
              (contextmenu)="$event.preventDefault(); addCredits.emit($event)"
              (wheel)="$event.preventDefault(); addCredits.emit($event)"
              matTooltip="+1000 Credits (Shift: +100k). Right-click: -10 (Shift: -1000). Wheel: ±100 (Shift: ±1000)"
              matTooltipPosition="left"
              aria-label="Add 1000 credits, right-click takes 10, the wheel dials 100">
        <td-icon name="coin" [size]="18"></td-icon>
        <span class="td-caps">Credits</span>
      </button>
      <button class="td-icon-btn qa-tile qa-cheat is-red"
              (click)="addHealth.emit($event)"
              (contextmenu)="$event.preventDefault(); addHealth.emit($event)"
              (wheel)="$event.preventDefault(); addHealth.emit($event)"
              matTooltip="+1000 HP (Shift: +100k). Right-click: -10 HP (Shift: -1000). Wheel: ±100 HP (Shift: ±1000)"
              matTooltipPosition="left"
              aria-label="Add 1000 HP, right-click takes 10 HP, the wheel dials 100 HP">
        <td-icon name="heart" [size]="18"></td-icon>
        <span class="td-caps">+HP</span>
      </button>
      <button class="td-icon-btn qa-tile qa-cheat is-teal"
              (click)="completeAllResearch.emit()"
              matTooltip="Complete all research"
              matTooltipPosition="left"
              aria-label="Complete all research">
        <td-icon name="flask" [size]="18"></td-icon>
        <span class="td-caps">Research</span>
      </button>
      <button class="td-icon-btn qa-tile qa-cheat is-teal"
              (click)="maxUpgradeAllTowers.emit()"
              matTooltip="Max-upgrade all towers"
              matTooltipPosition="left"
              aria-label="Max-upgrade all towers">
        <td-icon name="arrowUp" [size]="18"></td-icon>
        <span class="td-caps">Max Up</span>
      </button>
      <button class="td-icon-btn qa-tile is-wide qa-cheat is-orange"
              (click)="readyAbilities.emit()"
              matTooltip="Abilities ready: every ability researched, all charges back"
              matTooltipPosition="left"
              aria-label="Abilities ready: every ability researched, all charges back">
        <td-icon name="radiation" [size]="18"></td-icon>
        <span class="td-caps">Abilities</span>
      </button>
      <button class="td-icon-btn qa-tile qa-cheat is-green"
              (click)="readyHero.emit()"
              matTooltip="Hero ready: Mercenary Contract researched, the Mercenary hired for free"
              matTooltipPosition="left"
              aria-label="Hero ready: Mercenary Contract researched, the Mercenary hired for free">
        <td-icon name="user" [size]="18"></td-icon>
        <span class="td-caps">Hero</span>
      </button>

      <div class="td-caps qa-group">Waves &amp; Inspect</div>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="debugWindows.waveWindow().isOpen"
              (click)="debugWindows.toggle('wave')"
              matTooltip="Wave spawner"
              matTooltipPosition="left"
              aria-label="Wave spawner" [attr.aria-pressed]="debugWindows.waveWindow().isOpen">
        <td-icon name="wave" [size]="18"></td-icon>
        <span class="td-caps">Waves</span>
      </button>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="debugWindows.botWindow().isOpen"
              (click)="debugWindows.toggle('bots')"
              matTooltip="Bots"
              matTooltipPosition="left"
              aria-label="Bots" [attr.aria-pressed]="debugWindows.botWindow().isOpen">
        <td-icon name="bulb" [size]="18"></td-icon>
        <span class="td-caps">Bots</span>
      </button>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="debugWindows.towerWindow().isOpen"
              (click)="debugWindows.toggle('tower')"
              matTooltip="Tower inspector"
              matTooltipPosition="left"
              aria-label="Tower inspector" [attr.aria-pressed]="debugWindows.towerWindow().isOpen">
        <td-icon name="tower" [size]="18"></td-icon>
        <span class="td-caps">Towers</span>
      </button>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="debugWindows.enemyWindow().isOpen"
              (click)="debugWindows.toggle('enemy')"
              matTooltip="Enemy inspector"
              matTooltipPosition="left"
              aria-label="Enemy inspector" [attr.aria-pressed]="debugWindows.enemyWindow().isOpen">
        <td-icon name="bug" [size]="18"></td-icon>
        <span class="td-caps">Enemies</span>
      </button>
      <button class="td-icon-btn qa-tile"
              [class.is-on]="debugWindows.eventsWindow().isOpen"
              (click)="debugWindows.toggle('events')"
              matTooltip="Event bus"
              matTooltipPosition="left"
              aria-label="Event bus" [attr.aria-pressed]="debugWindows.eventsWindow().isOpen">
        <td-icon name="share" [size]="18"></td-icon>
        <span class="td-caps">Events</span>
      </button>
      <!-- Cell report: grid cells by click or Shift drag, as JSON to the clipboard -->
      <button class="td-icon-btn qa-tile"
              [class.is-on]="cellReport.active()"
              (click)="cellReport.toggle()"
              matTooltip="Cell report: click grid cells or Shift + drag a box, then copy them as JSON"
              matTooltipPosition="left"
              aria-label="Cell report" [attr.aria-pressed]="cellReport.active()">
        <td-icon name="grid" [size]="18"></td-icon>
        <span class="td-caps">Cells</span>
      </button>
      <!-- Corridor snapshot: everything of the corridor at this place as one JSON download -->
      <button class="td-icon-btn qa-tile"
              [class.is-on]="corridorSnapshot.busy()"
              (click)="corridorSnapshot.take()"
              matTooltip="Corridor snapshot: fingerprint, trace, every cell with its column, stations, tiles and a screenshot as one JSON download"
              matTooltipPosition="left"
              aria-label="Corridor snapshot" [attr.aria-busy]="corridorSnapshot.busy()">
        <td-icon name="camera" [size]="18"></td-icon>
        <span class="td-caps">Snapshot</span>
      </button>
      @if (corridorSnapshot.status(); as status) {
        <p class="td-note qa-status" role="status">{{ status }}</p>
      }
    </div>
    <button class="td-icon-btn"
            [class.is-on]="uiStore.devMenuExpanded()"
            (click)="uiStore.toggleMenu('dev')"
            matTooltip="Developer options"
            matTooltipPosition="above"
            aria-label="Developer options" [attr.aria-expanded]="uiStore.devMenuExpanded()">
      <td-icon name="text" [size]="18"></td-icon>
    </button>
  </div>
</div>
